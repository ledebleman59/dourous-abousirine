; Copiez ce fichier en config.ini (l'outil le fait pour vous) puis remplissez [ftp].
; config.ini contient votre mot de passe : ne le partagez avec personne.

[ftp]
; Dans l'espace client OVH : Hébergements > votre hébergement > FTP - SSH
hote = ftp.cluster0XX.hosting.ovh.net
utilisateur =
mot_de_passe =
; auto = connexion chiffrée si possible, sinon FTP simple. oui = chiffrée obligatoire. non = FTP simple.
chiffrement = auto

[site]
; Dossier des MP3 sur le FTP (celui que vous remplissez aujourd'hui)
dossier_audio_ftp = www/jdownloads
; Adresse publique de ce même dossier
url_audio = https://www.dourous-abousirine.fr/jdownloads
; Où envoyer le nouveau site sur le FTP, et son adresse correspondante.
; Pour tester sans toucher au site actuel : www/nouveau  <->  /nouveau/
; Le jour de la mise en ligne définitive : www  <->  /
dossier_site_ftp = www/nouveau
chemin_site = /nouveau/
